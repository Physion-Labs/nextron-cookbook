[project]
name = "nextron-cookbook"
dynamic = ["version"]
description = "tinker-cookbook recipes on NexCloud: tested settings, results, and what is supported."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Physion Labs", email = "support@physionlabs.ai" }]
keywords = ["nextron", "physion", "tinker", "reinforcement-learning", "fine-tuning"]
# The versions the recipes were measured with. Newer ones may work; `nextron-cookbook check` tells you.
dependencies = ["nextron-cloud>=0.1.0rc30", "tinker==0.39.0", "tinker-cookbook==0.6.1"]

[project.optional-dependencies]
math = ["tinker-cookbook[math-rl]==0.6.1"]

[project.scripts]
nextron-cookbook = "nextron_cookbook.cli:main"

[project.urls]
Homepage = "https://nextron.physionlabs.ai"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nextron_cookbook/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nextron_cookbook"]
